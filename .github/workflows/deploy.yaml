name: cd my app
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: login to docker
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/kub-1:${{github.sha}}
      - name: cloning the ops repo and updating the image
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone https://github.com/shyamagarwaldev/ops.git
          cd ops
          sed -i 's|image: shyamagarwaldev/kub-1:.*|image: shyamagarwaldev/kub-1:${{github.sha}}|' argo-ops/backend/manifest.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add argo-ops/backend/manifest.yaml
          git commit -m "Update argo-ops backend image to ${{ github.sha }}"
          git push https://${PAT}@github.com/shyamagarwaldev/ops.git main
